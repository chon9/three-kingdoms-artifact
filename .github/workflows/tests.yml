name: Godot rules and UI
on: [push, pull_request]

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Godot 4.5.2
        shell: bash
        run: |
          mkdir -p .tools/godot
          cd .tools/godot
          base=https://github.com/godotengine/godot/releases/download/4.5.2-stable
          archive=Godot_v4.5.2-stable_linux.x86_64.zip
          curl --fail --location --output "$archive" "$base/$archive"
          curl --fail --location --output SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " $archive$" SHA512-SUMS.txt | sha512sum --check -
          unzip "$archive"
          chmod +x Godot_v4.5.2-stable_linux.x86_64
          touch _sc_
          touch ../.gdignore
      - name: Import
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --editor --import
      - name: Rules, bot games and replay round trips
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/run_tests.gd
      - name: Localization, fonts and locale-independent state
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/i18n_test.gd
      - name: Steam boundary (fake GodotSteam, extension API cross-check)
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/steam_test.gd
      - name: UI smoke
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/ui_smoke.gd
      - name: Own decks (deck codes, deck rules, store, builder edits, replays)
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/deck_test.gd
      - name: Classic cards and bot matches
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/classic_cards_test.gd
      - name: Expanded card effects and deck matchup matrix
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/expanded_classic_test.gd
      - name: Card rules schema, lint, RULES_VERSION and Valve parity
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/rules_schema_test.gd
      - name: Rules kernel (triggers, Pulse, modifiers, targeting equivalence, purity, privacy)
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/rules_kernel_test.gd
      - name: Golden bot matches (state_digest after every command; re-record with tools/record_goldens.gd)
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/golden_test.gd
      - name: Differential test against the frozen pre-migration engine
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/differential_test.gd
      - name: Performance budgets (normalized by the legacy engine's speed)
        run: .tools/godot/Godot_v4.5.2-stable_linux.x86_64 --headless --path . --script res://tests/perf_test.gd
